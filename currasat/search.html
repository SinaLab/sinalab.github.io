    <script>
      function removeDiacritics(text) {
        var diacriticsRegex =
          /[\u0610-\u061A\u064B-\u065F\u06D6-\u06DC\u06DF-\u06E8\u06EA-\u06ED]/g;
        return text.replace(diacriticsRegex, '');
      }

      function updateTitle(searchTerm) {
        document.title =
          'معنى كلمة ' + searchTerm + ' باللهجات العربية - كراسات';
      }

      function updateCanonicalLink(searchTerm) {
        let cleanedTerm = removeDiacritics(searchTerm);
        let canonicalLink = document.querySelector('link[rel="canonical"]');

        if (!canonicalLink) {
          canonicalLink = document.createElement('link');
          canonicalLink.rel = 'canonical';
          document.head.appendChild(canonicalLink);
        }
        canonicalLink.href =
          'https://sina.birzeit.edu/currasat/search.html?' + cleanedTerm;
      }

      function performSearch(newSearchTerm) {
        let cleanedSearchTerm = removeDiacritics(newSearchTerm);

        // Update the URL without reloading the page
        let newUrl =
          window.location.pathname +
          '?' +
          encodeURIComponent(cleanedSearchTerm);
        history.pushState(null, '', newUrl);

        // Update search input, title, and canonical link
        document.getElementById('searchbar_main').value = newSearchTerm;
        updateTitle(newSearchTerm);
        updateCanonicalLink(newSearchTerm);

        getRes();
      }

      // Handle initial page load with query parameter
      let res = decodeURIComponent(window.location.search.substr(1));
      if (res !== '') {
        document.getElementById('searchbar_main').value = res;
        updateTitle(res);
        updateCanonicalLink(res);
        getRes();
      }

      // Search button click event
      document
        .getElementById('searchButton')
        .addEventListener('click', function () {
          let newSearchTerm = document.getElementById('searchbar_main').value;
          performSearch(newSearchTerm);
        });

      // Search on pressing Enter key
      document
        .getElementById('searchbar_main')
        .addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            let newSearchTerm = this.value;
            performSearch(newSearchTerm);
          }
        });
    </script>
  </body>
</html>
